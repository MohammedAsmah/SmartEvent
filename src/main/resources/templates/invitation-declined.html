<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invitation Declined</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-lg shadow-lg p-8 max-w-2xl w-full text-center">
    <div class="mb-6">
        <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </div>

    <h1 class="text-3xl font-bold text-gray-800 mb-4">Invitation Declined</h1>
    <p class="text-gray-600 text-lg mb-8">
        Thank you for letting us know that you won't be able to attend
        <span class="font-medium" th:text="${eventTitle}"></span>.
    </p>

    <p class="text-gray-600">
        We appreciate your response. If you change your mind, please contact the event organizer.
    </p>
</div>
</body>
</html>
