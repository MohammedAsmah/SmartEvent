<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invitation Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-lg shadow-lg p-8 max-w-2xl w-full">
    <div class="text-center mb-8">
        <svg class="mx-auto h-16 w-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5 13l4 4L19 7"></path>
        </svg>
        <h1 class="text-3xl font-bold text-gray-800 mt-4">Invitation Confirmed!</h1>
        <p class="text-gray-600 mt-2">Thank you for confirming your attendance</p>
    </div>

    <div class="bg-blue-50 p-6 rounded-lg mb-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Event Details</h2>
        <p class="text-gray-700"><span class="font-medium">Event:</span> <span th:text="${eventTitle}"></span></p>
        <p class="text-gray-700"><span class="font-medium">Date:</span> <span th:text="${#temporals.format(eventDate, 'MMMM dd, yyyy')}"></span></p>
        <p class="text-gray-700"><span class="font-medium">Guest:</span> <span th:text="${inviteName}"></span></p>
    </div>

    <div class="text-center">
        <p class="text-gray-700 mb-6">Your invitation QR code is ready to download.</p>
        <a th:href="'data:application/pdf;base64,' + ${pdfBase64}"
           th:download="${pdfFileName}"
           class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            <svg class="-ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            Download Invitation
        </a>
    </div>
</div>
</body>
</html>
